services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-pr-api

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      DATABASE_URL: postgresql://ai_agent:ai_agent_password@postgres:5432/ai_pull_request_agent

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-pr-worker

    command: [ "arq", "app.workers.review_worker.WorkerSettings" ]

    env_file:
      - ./backend/.env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      DATABASE_URL: postgresql://ai_agent:ai_agent_password@postgres:5432/ai_pull_request_agent

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:8-alpine

    container_name: ai-pr-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine

    container_name: ai-pr-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent_password
      POSTGRES_DB: ai_pull_request_agent

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ai_agent -d ai_pull_request_agent" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_data:
